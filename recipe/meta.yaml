{% set name = "mmgsuite" %}
{% set version = "5.8.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}_{{ version }}.tar.gz
  url: https://github.com/MmgTools/mmg/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 686eaab84de79c072f3aedf26cd11ced44c84b435d51ce34e016ad203172922f
  patches:
    - patchs/0001-Add-Option-to-deactivate-the-CPack-directives.patch

build:
  number: 15
  string: "vtk_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"  # [use_vtk == "ON"]
  ignore_run_exports_from:   # [use_vtk != "ON"]
    - {{ compiler('cxx') }}  # [use_vtk != "ON"]
    - {{ compiler('c') }}    # [use_vtk != "ON"]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake
    - ninja
    - git
    - setuptools-scm
  host:
    - libscotch              # [not win]
    - iscd-commons           # [not win]
    - iscd-linearelasticity  # [not win]
    - vtk-base               # [use_vtk == "ON"]
  run:
    - libscotch              # [not win]
    - iscd-commons           # [not win]
    - iscd-linearelasticity  # [not win]
    - vtk-base               # [use_vtk == "ON"]

test:
  source_files:
    - libexamples/mmg3d/io_generic_and_get_adja/cube.vtu  # [use_vtk == "ON"]
  commands:
    # Target executables cannot run while cross-compiling (for example,
    # osx-arm64 packages are built on osx-64 CI workers).
    - mmgs_O3 -h  || true  # [unix and build_platform == target_platform]
    - mmg2d_O3 -h || true  # [unix and build_platform == target_platform]
    - mmg3d_O3 -h || true  # [unix and build_platform == target_platform]
    - mmg3d_O3 libexamples/mmg3d/io_generic_and_get_adja/cube.vtu -out cube.mesh  # [use_vtk == "ON" and build_platform == target_platform]
    - test -f $PREFIX/lib/libmmg.so  # [linux]
    - test -f $PREFIX/lib/libmmg.dylib  # [osx]
    - test -f $PREFIX/include/mmg/libmmg.h  # [not win]
    - test -f $PREFIX/include/mmg/libmmgf.h  # [not win and not arm64]

about:
  home: https://www.mmgtools.org/mmg-open-source-consortium
  license: LGPL-3.0-only
  license_family: LGPL
  license_file: LICENSE
  summary: 'mmg - Surface and volume remeshers'
  description: |
    open source software for bidimensional and tridimensional surface and volume remeshing
  doc_url: https://www.mmgtools.org/mmg-remesher-try-mmg/mmg-remesher-tutorials
  dev_url: https://github.com/MmgTools/mmg

extra:
  recipe-maintainers:
    - ldallolio
    - fbordeu
